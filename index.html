<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>I Love You, Fahamida ❤️</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            /* Prevent scrolling/bouncing on mobile */
            touch-action: none; 
        }
        canvas {
            display: block;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
    <script>
        let particles = [];
        let poly = [];
        let problems = [];
        let arrows = [];
        let numParticles = 2200; // Slightly reduced for smoother mobile performance
        let scaleFactor;
        let baseDist; 

        let problemNames = ["FAMILY", "MY HEART", "DREAM", "LOVE", "STRESS", "PAIN", "LIFE", "BORHAN"];

        let touchX = 0;
        let touchY = 0;
        let isTouchDevice = 'ontouchstart' in window;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            noStroke();

            updateScale();
            generateHeart();
            generateParticles();
            generateProblems();
        }

        function updateScale() {
            let minDim = min(width, height);
            
            // 1. MAKE HEART SMALLER: Divided by 45 (was 30)
            scaleFactor = minDim / 45; 
            
            // 2. PULL PROBLEMS CLOSER: Multiplied by 0.35 (was 0.45)
            // This ensures text isn't pushed off the edge of the screen
            baseDist = minDim * 0.35; 
        }

        function generateHeart() {
            poly = [];
            let heartYOffset = scaleFactor * 1; 
            
            for (let t = 0; t < TWO_PI; t += 0.04) {
                let x = scaleFactor * 16 * pow(sin(t), 3);
                let y = -scaleFactor * (13 * cos(t) - 5 * cos(2*t) - 2 * cos(3*t) - cos(4*t));
                poly.push({
                    x: x + width / 2,
                    y: y + height / 2 - heartYOffset 
                });
            }
        }

        function generateParticles() {
            particles = [];
            let attempts = 0;
            // Limit random search to center area for speed
            let searchArea = min(width, height) * 0.3;

            while (particles.length < numParticles && attempts < 10000) {
                let rx = random(width / 2 - searchArea, width / 2 + searchArea);
                let ry = random(height / 2 - searchArea, height / 2 + searchArea);

                if (pointInPolygon({x: rx, y: ry}, poly)) {
                    particles.push({
                        pos: createVector(rx, ry),
                        home: createVector(rx, ry),
                        vel: createVector(0, 0)
                    });
                }
                attempts++;
            }
        }

        function generateProblems() {
            problems = [];
            for (let i = 0; i < problemNames.length; i++) {
                let angle = i * TWO_PI / problemNames.length - HALF_PI; // Start from top
                let dist = baseDist;
                let px = width / 2 + dist * cos(angle);
                let py = height / 2 + dist * sin(angle);
                problems.push({x: px, y: py, name: problemNames[i]});
            }
        }

        function draw() {
            // Trail effect
            fill(0, 0, 0, 40);
            rect(0, 0, width, height);

            let mx = isTouchDevice ? touchX : mouseX;
            let my = isTouchDevice ? touchY : mouseY;

            // Spawn arrows
            if (frameCount % 4 === 0 && random(1) < 0.3) {
                let prob = random(problems);
                let arr = {pos: createVector(prob.x, prob.y)};
                let center = createVector(width / 2, height / 2);
                // Arrow speed relative to screen size
                let speed = min(width, height) * 0.01; 
                let dir = center.copy().sub(arr.pos).normalize().mult(speed);
                arr.vel = dir;
                arrows.push(arr);
            }

            // Draw arrows
            for (let i = arrows.length - 1; i >= 0; i--) {
                let a = arrows[i];
                a.pos.add(a.vel);

                stroke(255, 255, 100);
                strokeWeight(2);
                let tailLen = min(width, height) * 0.02;
                let from = a.pos.copy().sub(a.vel.copy().normalize().mult(tailLen));
                line(from.x, from.y, a.pos.x, a.pos.y);

                if (a.pos.dist(createVector(width / 2, height / 2)) < scaleFactor * 2) {
                    arrows.splice(i, 1);
                }
            }
            noStroke();

            // Draw particles
            for (let p of particles) {
                let acc = createVector(0, 0);

                let toHome = p.home.copy().sub(p.pos).mult(0.02);
                acc.add(toHome);

                let mouse = createVector(mx, my);
                let dMouse = p.pos.dist(mouse);
                let repelRadius = isTouchDevice ? 150 : 100;
                
                // Only repel if user is touching/hovering
                if (dMouse < repelRadius && (mx !== 0 || my !== 0)) {
                    let repel = p.pos.copy().sub(mouse).normalize().mult(20 / (dMouse * 0.05 + 1));
                    acc.add(repel);
                }

                for (let a of arrows) {
                    let d = p.pos.dist(a.pos);
                    if (d < repelRadius * 0.5) {
                        let repel = p.pos.copy().sub(a.pos).normalize().mult(10 / (d + 1));
                        acc.add(repel);
                    }
                }

                p.vel.add(acc);
                p.vel.mult(0.92);
                p.pos.add(p.vel);

                fill(255, 20, 147); // Deep Pink
                ellipse(p.pos.x, p.pos.y, 3, 3);
            }

            // Draw TEXT
            textAlign(CENTER, CENTER);
            
            // 1. Problem Names
            textSize(constrain(min(width, height) / 30, 10, 16)); 
            fill(200, 200, 255);
            for (let prob of problems) {
                text(prob.name, prob.x, prob.y);
            }

            // 2. Center Name
            textSize(constrain(min(width, height) / 10, 24, 60)); 
            fill(255);
            textStyle(BOLD);
            text("FAHAMIDA", width / 2, height / 2 - scaleFactor * 2);

            // 3. I Love You
            textSize(constrain(min(width, height) / 20, 12, 24)); 
            fill(255, 100, 150);
            textStyle(NORMAL);
            text("I LOVE YOU ❤️", width / 2, height / 2 + scaleFactor * 4);
        }

        function touchMoved() { touchX = mouseX; touchY = mouseY; return false; }
        function touchStarted() { touchX = mouseX; touchY = mouseY; return false; }
        function touchEnded() { touchX = 0; touchY = 0; return false; }

        function pointInPolygon(point, poly) {
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                let xi = poly[i].x, yi = poly[i].y;
                let xj = poly[j].x, yj = poly[j].y;
                let intersect = ((yi > point.y) != (yj > point.y)) && (point.x < (xj - xi) * (point.y - yi) / (yj - yi + 0.001) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            updateScale();
            generateHeart();
            generateProblems();
            generateParticles();
        }
    </script>
</body>
</html>
