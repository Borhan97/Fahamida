<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fahamida</title>
    <style>
        * { margin: 0; padding: 0; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            touch-action: none; 
        }
        canvas {
            display: block;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
</head>
<body>
    <script>
        let particles = [];
        let poly = [];
        let problems = [];
        let arrows = [];
        let numParticles = 1500; 
        let scaleFactor;
        let baseDist;

        let problemNames = [
            "MY HEART", 
            "STRESS", 
            "LOVE", 
            "DEPRESSION", 
            "LIFE", 
            "PAIN", 
            "DREAM", 
            "FAMILY", 
            "FRIENDS"
        ];

        let touchX = 0;
        let touchY = 0;
        let isTouchDevice = 'ontouchstart' in window;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            noStroke();

            updateScale();
            generateHeart();
            generateParticles();
            generateProblems();
        }

        function updateScale() {
            let minDim = min(width, height);
            scaleFactor = minDim / (width < 600 ? 45 : 50); 
            let radiusMult = width < 600 ? 0.35 : 0.40;
            baseDist = minDim * radiusMult; 
        }

        function generateHeart() {
            poly = [];
            let heartYOffset = scaleFactor * 0.5; 
            
            for (let t = 0; t < TWO_PI; t += 0.04) {
                let x = scaleFactor * 16 * pow(sin(t), 3);
                let y = -scaleFactor * (13 * cos(t) - 5 * cos(2*t) - 2 * cos(3*t) - cos(4*t));
                poly.push({
                    x: x + width / 2,
                    y: y + height / 2 - heartYOffset 
                });
            }
        }

        function generateParticles() {
            particles = [];
            let attempts = 0;
            let searchArea = min(width, height) * 0.25;

            while (particles.length < numParticles && attempts < 10000) {
                let rx = random(width / 2 - searchArea, width / 2 + searchArea);
                let ry = random(height / 2 - searchArea, height / 2 + searchArea);

                if (pointInPolygon({x: rx, y: ry}, poly)) {
                    particles.push({
                        pos: createVector(rx, ry),
                        home: createVector(rx, ry),
                        vel: createVector(0, 0)
                    });
                }
                attempts++;
            }
        }

        function generateProblems() {
            problems = [];
            for (let i = 0; i < problemNames.length; i++) {
                let angle = i * TWO_PI / problemNames.length - HALF_PI; 
                let dist = baseDist;
                let px = width / 2 + dist * cos(angle);
                let py = height / 2 + dist * sin(angle);
                problems.push({
                    x: px, 
                    y: py, 
                    name: problemNames[i]
                });
            }
        }

        function draw() {
            // Clean dark background with subtle trails
            fill(0, 0, 0, 50);
            rect(0, 0, width, height);

            let mx = isTouchDevice ? touchX : mouseX;
            let my = isTouchDevice ? touchY : mouseY;

            // Arrow generation and movement
            if (frameCount % 6 === 0 && random(1) < 0.35) {
                let prob = random(problems);
                let arr = {pos: createVector(prob.x, prob.y)};
                let center = createVector(width / 2, height / 2);
                let speed = min(width, height) * 0.015;
                let dir = center.copy().sub(arr.pos).normalize().mult(speed);
                arr.vel = dir;
                arrows.push(arr);
            }

            for (let i = arrows.length - 1; i >= 0; i--) {
                let a = arrows[i];
                a.pos.add(a.vel);

                // Clean white arrows
                stroke(255, 255, 255, 200);
                strokeWeight(2);
                let tailLen = min(width, height) * 0.025;
                let from = a.pos.copy().sub(a.vel.copy().normalize().mult(tailLen));
                line(from.x, from.y, a.pos.x, a.pos.y);

                if (a.pos.dist(createVector(width / 2, height / 2)) < scaleFactor * 5) {
                    arrows.splice(i, 1);
                }
            }
            noStroke();

            // Particle physics
            for (let p of particles) {
                let acc = createVector(0, 0);

                let toHome = p.home.copy().sub(p.pos).mult(0.02);
                acc.add(toHome);

                let mouse = createVector(mx, my);
                let dMouse = p.pos.dist(mouse);
                let repelRadius = isTouchDevice ? 150 : 100;
                
                if (dMouse < repelRadius && (mx !== 0 || my !== 0)) {
                    let repel = p.pos.copy().sub(mouse).normalize().mult(20 / (dMouse * 0.05 + 1));
                    acc.add(repel);
                }

                for (let a of arrows) {
                    let d = p.pos.dist(a.pos);
                    if (d < repelRadius * 0.5) {
                        let repel = p.pos.copy().sub(a.pos).normalize().mult(10 / (d + 1));
                        acc.add(repel);
                    }
                }

                p.vel.add(acc);
                p.vel.mult(0.92);
                p.pos.add(p.vel);

                // Clean white particles
                fill(255, 255, 255, 230);
                ellipse(p.pos.x, p.pos.y, 2.5, 2.5);
            }

            // Clean text rendering
            textAlign(CENTER, CENTER);
            
            // Problem names - minimal and clean
            let fontSize = constrain(min(width, height) / (width < 600 ? 30 : 34), 10, 16);
            textSize(fontSize);
            fill(180, 180, 180);
            
            for (let prob of problems) {
                text(prob.name, prob.x, prob.y);
            }

            // Center name - bold and clean
            let centerSize = constrain(min(width, height) / 10, 32, 75);
            textSize(centerSize);
            textStyle(BOLD);
            fill(255, 255, 255);
            text("FAHAMIDA", width / 2, height / 2);
        }

        function touchMoved() { touchX = mouseX; touchY = mouseY; return false; }
        function touchStarted() { touchX = mouseX; touchY = mouseY; return false; }
        function touchEnded() { touchX = 0; touchY = 0; return false; }

        function pointInPolygon(point, poly) {
            let inside = false;
            for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
                let xi = poly[i].x, yi = poly[i].y;
                let xj = poly[j].x, yj = poly[j].y;
                let intersect = ((yi > point.y) != (yj > point.y)) && (point.x < (xj - xi) * (point.y - yi) / (yj - yi + 0.001) + xi);
                if (intersect) inside = !inside;
            }
            return inside;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            updateScale();
            generateHeart();
            generateProblems();
            generateParticles();
        }
    </script>
</body>
</html>
